name: Tests

on:
  push:
    branches: [ros2]
  pull_request:
  workflow_dispatch:

jobs:
  serl-framework:
    name: serl_framework unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy gymnasium scipy opencv-python-headless pyyaml
          pip install -e serl_framework
      - name: Run unit tests
        run: python -m pytest serl_framework/test -q

  serl-ros2:
    name: serl_ros2 unit tests (ROS 2 Jazzy)
    runs-on: ubuntu-latest
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y python3-pytest python3-numpy python3-yaml ros-jazzy-message-filters
      - name: Build serl_msgs
        shell: bash
        run: |
          mkdir -p /tmp/ws/src
          ln -s "$GITHUB_WORKSPACE/serl_msgs" /tmp/ws/src/serl_msgs
          cd /tmp/ws
          . /opt/ros/jazzy/setup.sh
          colcon build --symlink-install --packages-select serl_msgs \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
      - name: Run unit tests
        shell: bash
        run: |
          . /opt/ros/jazzy/setup.sh
          . /tmp/ws/install/setup.sh
          export PYTHONPATH="$GITHUB_WORKSPACE/serl_framework:$PYTHONPATH"
          cd serl_ros2
          python3 -m pytest test -q

  training-stack:
    name: requirements.txt + JAX smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the documented training stack
        run: |
          python -m pip install --upgrade pip
          pip install "jax[cpu]==0.4.36"
          pip install -r requirements.txt
          pip install -e serl_launcher
          pip install -e serl_framework
      - name: JAX / Flax smoke test
        run: |
          python - <<'EOF'
          import jax
          import jax.numpy as jnp
          import flax.linen as nn
          import optax

          assert jax.__version__ == "0.4.36", jax.__version__
          print("devices:", jax.devices())

          # Tiny end-to-end check: init a Flax module, take one optax gradient step.
          model = nn.Dense(features=2)
          params = model.init(jax.random.PRNGKey(0), jnp.ones((1, 3)))

          def loss_fn(p):
              return jnp.mean(model.apply(p, jnp.ones((4, 3))) ** 2)

          grads = jax.jit(jax.grad(loss_fn))(params)
          tx = optax.adam(1e-3)
          opt_state = tx.init(params)
          updates, _ = tx.update(grads, opt_state, params)
          params = optax.apply_updates(params, updates)
          print("smoke loss after one step:", float(loss_fn(params)))
          EOF
      - name: Import training entry points
        env:
          JAX_PLATFORMS: cpu
          # The recording scripts import pynput, which needs a display unless
          # the dummy backend is forced (CI runners are headless).
          PYNPUT_BACKEND_KEYBOARD: dummy
          PYNPUT_BACKEND_MOUSE: dummy
        run: |
          for m in train_rlpd record_demos record_success_fail train_reward_classifier stream_classifier_prob; do
            echo "import serl_framework.train.$m"
            python -c "import serl_framework.train.$m"
          done
